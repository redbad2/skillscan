# LLM (大模型) 配置文件
# SkillScan - Skills 威胁分析引擎

# ==========================================
# LLM 提供商配置
# ==========================================

llm_providers:
  # OpenAI 配置
  openai:
    enabled: false
    api_key: ""  # 从环境变量 OPENAI_API_KEY 读取
    base_url: "https://api.openai.com/v1"  # 可用于代理或自托管
    model: "gpt-4-turbo-preview"
    temperature: 0.1
    max_tokens: 4096
    timeout: 60  # 超时秒数
    retry_count: 3
    retry_delay: 2  # 秒

  # Anthropic 配置
  anthropic:
    enabled: false
    api_key: ""  # 从环境变量 ANTHROPIC_API_KEY 读取
    base_url: "https://api.anthropic.com"
    model: "claude-3-sonnet-20240229"
    max_tokens: 4096
    timeout: 60
    retry_count: 3
    retry_delay: 2

  # Azure OpenAI 配置
  azure_openai:
    enabled: false
    api_key: ""
    endpoint: "https://YOUR_RESOURCE.openai.azure.com"
    api_version: "2024-02-15-preview"
    deployment_name: "gpt-4-turbo"  # 你的部署名称
    temperature: 0.1
    max_tokens: 4096
    timeout: 60

  # 本地模型 (Ollama 等)
  local:
    enabled: false
    base_url: "http://localhost:11434/v1"
    model: "llama2"
    api_key: ""  # 通常为空
    temperature: 0.1
    max_tokens: 4096
    timeout: 120  # 本地模型可能更慢

  # 火山引擎 (Volcengine) - Doubao / ByteDance LLM
  volcengine:
    enabled: false
    api_key: ""  # 从环境变量 VOLCENGINE_API_KEY 读取
    base_url: "https://ark.cn-beijing.volces.com/api/v3"  # 火山引擎 ARK API
    model: "doubao-pro-32k"  # 默认豆包模型
    temperature: 0.1
    max_tokens: 4096
    timeout: 60
    retry_count: 3
    retry_delay: 2

  # 自定义 OpenAI 兼容端点
  # 支持任何兼容 OpenAI chat completions API 的服务端点
  custom_openai:
    enabled: false
    api_key: ""  # 必填
    base_url: "https://your-api.example.com/v1"  # 必填，API 基础 URL
    model: ""  # 必填，模型名称
    temperature: 0.1
    max_tokens: 4096
    timeout: 60
    retry_count: 3
    retry_delay: 2

  # 自定义 Anthropic 兼容端点
  # 支持任何兼容 Anthropic Messages API 的服务端点
  custom_anthropic:
    enabled: false
    api_key: ""  # 必填
    base_url: "https://your-api.example.com/anthropic/v1"  # 必填，API 基础 URL
    model: ""  # 必填，模型名称 (如 claude-3-sonnet)
    max_tokens: 4096
    timeout: 60
    retry_count: 3
    retry_delay: 2

# ==========================================
# 默认 LLM 选择
# ==========================================

default_provider: "openai"  # 可选: openai, anthropic, azure_openai, local, volcengine, custom_openai, custom_anthropic

# ==========================================
# LLM 分析配置
# ==========================================

analysis:
  # 是否启用 LLM 分析
  enabled: true
  
  # 静态分析置信度低于此值时调用 LLM
  static_confidence_threshold: 0.7
  
  # LLM 分析确认阈值 - 低于此值的静态结果将被 LLM 确认/推翻
  llm_confirm_threshold: 0.6
  
  # LLM 推翻阈值 - 高于此置信度的静态发现不会被 LLM 推翻
  llm_override_threshold: 0.8
  
  # LLM 分析超时 (秒)
  timeout: 25
  
  # 最大重试次数
  max_retries: 3

# ==========================================
# Prompt 模板配置
# ==========================================

prompts:
  # 系统提示词
  system_prompt_zh: |
    你是一个专业的 AI Agent Skill 安全分析专家。请分析以下 Skill 代码的安全漏洞。

  system_prompt_en: |
    You are a professional AI Agent Skill security analyst. Please analyze the following Skill code for security vulnerabilities.

  # 分析请求提示词模板
  analysis_template_zh: |
    请分析以下 Agent Skill 代码，检测以下类型的漏洞：
    1. **提示注入 (P1-P4)**: 指令覆盖、隐藏指令、外传命令、行为操纵
    2. **数据外泄 (E1-E4)**: 外部数据传输、环境变量收集、文件枚举、上下文泄露
    3. **权限提升 (PE1-PE3)**: 过度权限、sudo/root执行、凭据访问
    4. **供应链风险 (SC1-SC3)**: 未固定依赖、外部脚本获取、混淆代码

    ## SKILL.md 内容:
    {skill_md}

    ## 脚本文件:
    {scripts}

  analysis_template_en: |
    Please analyze the following Agent Skill code for security vulnerabilities:
    1. **Prompt Injection (P1-P4)**: Instruction override, hidden instructions, exfiltration commands, behavior manipulation
    2. **Data Exfiltration (E1-E4)**: External data transmission, environment variable harvesting, file system enumeration, context leakage
    3. **Privilege Escalation (PE1-PE3)**: Excessive permissions, sudo/root execution, credential access
    4. **Supply Chain Risks (SC1-SC3)**: Unpinned dependencies, external script fetching, obfuscated code

    ## SKILL.md Content:
    {skill_md}

    ## Scripts:
    {scripts}

# ==========================================
# 响应解析配置
# ==========================================

response_parsing:
  # JSON 响应格式
  json_format: |
    {{
      "vulnerabilities": [
        {{
          "pattern_code": "P1",
          "category": "prompt_injection",
          "severity": "high",
          "confidence": 0.85,
          "file": "SKILL.md",
          "line": 10,
          "snippet": "...",
          "description": "..."
        }}
      ],
      "summary": "...",
      "risk_score": 0.7
    }}

  # 缓存配置
  cache:
    enabled: true
    ttl: 3600  # 秒 - 同一内容的 LLM 分析结果缓存时间

# ==========================================
# 成本控制
# ==========================================

cost_control:
  # 每月最大预算 (美元)
  monthly_budget: 100.0
  
  # 每次分析最大 token 数
  max_tokens_per_analysis: 8192
  
  # 启用成本跟踪
  enable_cost_tracking: true
  
  # 成本超限时的行为: "block", "warn", "ignore"
  on_budget_exceeded: "warn"

# ==========================================
# 调试配置
# ==========================================

debug:
  # 保存原始 LLM 响应
  save_raw_responses: false
  
  # 保存路径
  save_path: "logs/llm_responses/"
  
  # 详细日志
  verbose_logging: false
