version: '3.8'

services:
  # SkillScan API服务
  skillscan:
    build: .
    container_name: skillscan-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=skillscan
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - LOG_LEVEL=INFO
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # MongoDB数据库
  mongodb:
    image: mongo:7.0
    container_name: skillscan-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=skillscan
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: skillscan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Celery Worker（可选）
  celery-worker:
    build: .
    container_name: skillscan-worker
    command: celery -A src.celery_app worker --loglevel=info --concurrency=4
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=skillscan
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  # MongoDB Web管理界面（可选）
  mongo-express:
    image: mongo-express:latest
    container_name: skillscan-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
